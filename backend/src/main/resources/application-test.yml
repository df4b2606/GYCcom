# Test Environment Configuration
spring:
  # Use in-memory H2 database for testing
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  
  # JPA Configuration for testing
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false
  
  # Redis Configuration for testing (use embedded Redis if available)
  redis:
    host: localhost
    port: 6379
    database: 1  # Use different database for testing
    timeout: 1000ms

# Logging Configuration for testing
logging:
  level:
    com.example.backend: warn
    org.springframework: warn
    org.hibernate: warn

# Disable Swagger in test environment
springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

# Disable Knife4j in test environment
knife4j:
  enable: false
